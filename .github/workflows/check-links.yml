name: Check Tool Links

on:
  schedule:
    # Runs daily at 03:00 UTC (~8:30 AM IST)
    - cron: '0 3 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit tools.json changes back

# Prevents two runs from racing each other (e.g. a scheduled run overlapping
# with a manual "Run workflow" click). Extra runs wait in line instead of
# both trying to push at once.
concurrency:
  group: check-links
  cancel-in-progress: false

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run link checker
        run: python3 check_links.py

      - name: Commit updated tools.json (if changed)
        run: |
          git config user.name "Directory Freshness Bot"
          git config user.email "actions@github.com"
          git add tools.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto: link check $(date -u +%Y-%m-%d)"
            # If main moved since we checked out, rebase our commit on top
            # of the latest and retry the push, instead of failing outright.
            for i in 1 2 3; do
              if git push; then
                break
              fi
              echo "Push rejected, pulling latest and retrying ($i/3)..."
              git pull --rebase
            done
          fi
