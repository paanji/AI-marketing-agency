name: SEO Report

on:
  schedule:
    # Weekly, Tuesday 05:00 UTC — after link check + discovery have run
    - cron: '0 5 * * 2'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: seo-report
  cancel-in-progress: false

jobs:
  seo-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-auth google-api-python-client beautifulsoup4 lxml requests

      - name: Write service account credentials to file
        run: echo '${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}' > gsc_credentials.json

      - name: Run SEO agent
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 agents/seo/seo_agent.py

      - name: Remove credentials file (never commit this)
        run: rm -f gsc_credentials.json

      - name: Commit updated report (if changed)
        run: |
          git config user.name "SEO Agent Bot"
          git config user.email "actions@github.com"
          git add agents/seo/seo_report.md agents/seo/seo_data.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto: SEO report $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              if git push; then
                break
              fi
              echo "Push rejected, pulling latest and retrying ($i/3)..."
              git pull --rebase
            done
          fi
