name: Deploy Site (Full)

on:
  workflow_dispatch: {}   # trigger manually from the Actions tab — no schedule

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy site files to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ./
          state-name: .ftp-deploy-sync-state-fullsite.json
          exclude: |
            **
            !index.html
            !sitemap.xml
            !about.html
            !contact.html
            !favicon.ico
            !guides/**
            !assets/hero/**
            !assets/brand/**
