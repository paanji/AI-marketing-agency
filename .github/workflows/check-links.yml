name: Check Tool Links

on:
  schedule:
    # Runs daily at 03:00 UTC (~8:30 AM IST)
    - cron: '0 3 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit tools.json changes back

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run link checker
        run: python3 check_links.py

      - name: Commit updated tools.json (if changed)
        run: |
          git config user.name "Directory Freshness Bot"
          git config user.email "actions@github.com"
          git add tools.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Auto: link check $(date -u +%Y-%m-%d)"
          git push
