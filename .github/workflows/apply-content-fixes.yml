name: Apply Content Agent Fixes
on:
  push:
    branches: [main]
    paths:
      - "agents/content/content_pending.json"
permissions:
  contents: write   # needed so the workflow can commit applied file changes back
# Prevents two Content Agent runs from racing each other and pushing at once.
concurrency:
  group: apply-content-fixes
  cancel-in-progress: false
jobs:
  apply-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply approved fixes
        run: python3 agents/content/apply_content_fixes.py

      # NOTE: this whitelist must list every file the Content Agent can touch.
      # As of today that's the 3 known pages + llms.txt. If a new page is added
      # to the sitemap and gets content_agent fixes, add it here too, or it
      # will be applied locally/committed but never actually deployed.
      - name: Deploy changed site files to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ./
          exclude: |
            **
            !index.html
            !video-ai-tools.html
            !best-free-ai-video-editing-tools.html
            !llms.txt

      - name: Commit updated files (if changed)
        run: |
          git config user.name "Content Agent Bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Content Agent: apply approved fixes $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              if git push; then
                break
              fi
              echo "Push rejected, pulling latest and retrying ($i/3)..."
              git pull --rebase
            done
          fi
