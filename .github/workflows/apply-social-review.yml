name: Apply Social Media Review Decisions

on:
  push:
    branches: [main]
    paths:
      - 'agents/social-media/social_pending.json'

concurrency:
  group: social-media-agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply review decisions
        working-directory: agents/social-media
        run: python3 apply_social_review.py

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agents/social-media/social_pending.json agents/social-media/social_rejected.json agents/social-media/ready_to_post.json
          git diff --staged --quiet || git commit -m "Social Media Agent: applied review decisions"
          git pull --rebase
          git push
