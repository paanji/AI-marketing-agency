name: Apply Outreach Review Decisions

on:
  push:
    branches: [main]
    paths:
      - 'agents/outreach/outreach_pending.json'

concurrency:
  group: outreach-agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply review decisions
        working-directory: agents/outreach
        run: python3 apply_outreach.py

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agents/outreach/outreach_pending.json agents/outreach/outreach_log.json agents/outreach/outreach_review.md agents/outreach/outreach_ready_to_send.md
          git diff --staged --quiet || git commit -m "Outreach Agent: applied review decisions"
          git pull --rebase
          git push
