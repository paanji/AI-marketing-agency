name: Build Content Agent Queue
on:
  workflow_run:
    workflows: ["SEO Agent Weekly Report"]
    types:
      - completed
  workflow_dispatch: {}
permissions:
  contents: write   # needed so the workflow can commit content_pending.json changes back
concurrency:
  group: build-content-queue
  cancel-in-progress: false
jobs:
  build-queue:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build content_pending.json from seo_data.json
        run: python3 agents/content/build_content_queue.py

      - name: Commit updated queue (if changed)
        run: |
          git config user.name "Content Agent Bot"
          git config user.email "actions@github.com"
          git add agents/content/content_pending.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Content Agent: refresh review queue $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              if git push; then
                break
              fi
              echo "Push rejected, pulling latest and retrying ($i/3)..."
              git pull --rebase
            done
          fi
